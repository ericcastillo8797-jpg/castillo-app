<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Castillo</title>
<style>html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}iframe{border:0;display:block;width:100%;height:100%}</style>
</head><body>
<script>
// Envoltorio del reproductor. Desde que la app va empaquetada, sus pantallas se sirven desde el
// propio movil y YOUTUBE SE NIEGA a incrustar el video ahi (error 153): solo acepta paginas
// servidas desde una direccion web de verdad. Esta pagina SI vive en internet, en la misma
// direccion de siempre, asi que YouTube la acepta como acepto la app antes de empaquetarla.
// La app carga esta pagina dentro de un marco y esta carga el video dentro de otro.
(function () {
  var id = '';
  try { id = (new URLSearchParams(location.search).get('v') || '').replace(/[^A-Za-z0-9_-]/g, ''); } catch (e) {}
  if (!id) return;
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
  f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
  f.setAttribute('allowfullscreen', '');
  f.setAttribute('playsinline', '');
  document.body.appendChild(f);
})();
</script>
</body></html>
